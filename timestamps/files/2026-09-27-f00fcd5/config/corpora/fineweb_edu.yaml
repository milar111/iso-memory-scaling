# Second corpus: a separately preregistered arm (PREREGISTRATION.md Amendment A6).
# Same grid cells, architectures, token budgets and protocol as the TinyStories primary
# sweep; only the text differs. It can never override the TinyStories result.
#
# The pool is a PREFIX of one pinned FineWeb-Edu shard, in stored order, so it can be
# rebuilt byte-for-byte from this file alone. n_docs is sized so that the 98% train
# split holds at least TinyStories' 805,873,616 train tokens under its own tokenizer,
# which makes every cell see the same token count and the same number of epochs as its
# TinyStories counterpart. Sizing is done by scripts/size_corpus.py, then verified by
# scripts/prepare_data.py, which also fills in the hashes below. Commit both.
