[project]
name = "isomem"
version = "0.1.0"
description = "Iso-memory comparison of weight precisions for quantization-aware-trained small transformers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "datasets>=3.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isomem"]
